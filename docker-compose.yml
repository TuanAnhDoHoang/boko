version: '3.8'

services:
  # Frontend Service
  app:
    container_name: boko_app
    build:
      context: ./app        # Points to the app subdirectory
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
    env_file:
      - app/.env
    environment:
      - NODE_ENV=production
 
