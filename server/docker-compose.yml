services:
  db:
    image: postgres:16
    container_name: boko-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: boko_db
    ports:
      - "5432:5432"
    volumes:
      - boko-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boko_db"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: boko-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "123456"
      DB_NAME: boko_db
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: boko-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - app
    restart: unless-stopped

volumes:
  boko-pgdata: