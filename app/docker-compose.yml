version: '3.8'

services:
  app:
    container_name: boko_frontend
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80" # Truy cập ở máy host qua port 3000. Cổng 80 là nội bộ của Nginx.
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - boko-net

